services:
  # Backend API Server (Express + SSE + Mongoose)
  - type: web
    name: prepkit-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:core && npm run build --workspace=@prepkit/backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOW_LOCAL_URLS
        value: "false"

  # Frontend Web UI (Next.js 14 App Router)
  - type: web
    name: prepkit-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:core && npm run build --workspace=@prepkit/frontend
    startCommand: npm run start:frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
